# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Values marked `sync: false` are asked for once when the Blueprint is created.
# Full walkthrough: docs/DEPLOYMENT.md
#
# Payments need an always-on instance: the payment watcher confirms orders
# within seconds and the sweeper drives payouts. The free plan sleeps (nothing
# is lost, the watcher replays from its cursor, but confirmations wait for a
# wake-up), so use `starter` or above once payments are live.
services:
  - type: web
    name: fysi-api
    runtime: docker
    plan: free
    # Keep the API next to the database: use the Render region closest to your Supabase region.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: fysi
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: SWAGGER_ENABLED
        value: 'true'
      # Supabase session pooler URL (port 5432). See docs/DATABASE.md.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: '5'
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # 32 random bytes, base64. Set it yourself and keep a copy: Render's generated
      # values are not guaranteed to be 32 bytes, and losing it locks out every 2FA user.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: WALLET_PROVIDER
        value: local
      - key: MFA_REQUIRED_ROLES
        value: vendor,admin,super_admin
      - key: ADMIN_SESSION_IDLE_MINUTES
        value: '60'
      - key: STELLAR_NETWORK
        value: testnet
      # Testnet only: Circle's testnet USDC. Mainnet values are refused at boot.
      - key: STELLAR_ASSETS
        value: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      # Supabase Storage over S3 (docs/DEPLOYMENT.md). Keys are server-only secrets.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      # Staging: no email provider yet, so codes go to the Render logs.
      # Replace with RESEND_API_KEY + MAIL_FROM before launch.
      - key: MAIL_CONSOLE_IN_PRODUCTION
        value: 'true'
